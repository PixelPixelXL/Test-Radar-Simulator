<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa-Múndi de Radares NEXRAD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #04080c;
      color: #cfe9cf;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #barra-topo {
      padding: 12px 16px;
      background: #0b131b;
      border-bottom: 1px solid #1f3040;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    #sm-regions button {
      background: #142230;
      color: #00ff66;
      border: 1px solid #2b455e;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      border-radius: 4px;
    }
    #sm-regions button:hover {
      background: #1f354a;
    }
    #sm-label {
      font-size: 14px;
      color: #ffd23f;
    }
    #mapa-modal {
      flex: 1;
      display: flex;
      width: 100%;
    }
    #sitemap {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div id="barra-topo">
    <div id="sm-regions"></div>
    <div id="sm-label">Carregando mapa-múndi...</div>
    <button id="sm-close" style="display:none;">Fechar</button>
  </div>

  <div id="mapa-modal">
    <canvas id="sitemap"></canvas>
  </div>

  <!-- Carrega os seus dois arquivos -->
  <script src="radars.js"></script>
  <script src="map.js"></script>

  <!-- Inicia o mapa-múndi automaticamente -->
  <script>
    window.addEventListener("load", () => {
      let radarAtual = "KBOX"; // Radar inicial de exemplo

      function abrirMapa() {
        window.RadarMap.openPicker(radarAtual, (codigoEscolhido) => {
          radarAtual = codigoEscolhido;
          alert("Radar selecionado: " + codigoEscolhido);
          abrirMapa(); // Mantém o mapa aberto após o clique
        });
      }

      abrirMapa();
      window.addEventListener("resize", abrirMapa);
    });
  </script>
</body>
</html>
